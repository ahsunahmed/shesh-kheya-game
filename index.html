<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1a2238" />
<meta name="description" content="বরিশালের এক নদীপাড়ের রহস্য ও উদ্ধারের ২ডি গল্প-খেলা।" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>শেষ খেয়ার সংকেত</title>
<style>
  @font-face{
    font-family:'NotoBengali';
    src:url('./assets/fonts/bengali-400.woff2') format('woff2');
    font-weight:400; font-display:block;
  }
  @font-face{
    font-family:'NotoBengali';
    src:url('./assets/fonts/bengali-700.woff2') format('woff2');
    font-weight:700; font-display:block;
  }
  html,body{margin:0;padding:0;height:100%;background:#0c111d;overflow:hidden;
    font-family:'NotoBengali',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
    touch-action:none;overscroll-behavior:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c111d;}
  canvas{display:block;background:#0c111d;image-rendering:auto;}
  /* Loading splash */
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#e8e0cf;background:#10172a;z-index:10;gap:14px;}
  #boot h1{font-size:clamp(22px,5vw,40px);font-weight:700;margin:0;letter-spacing:1px;color:#f3e7c8;}
  #boot .bar{width:min(60vw,320px);height:8px;background:#26314f;border-radius:6px;overflow:hidden;}
  #boot .bar>i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#f2b05e,#f5d58a);
    border-radius:6px;animation:load 1.1s ease-in-out infinite;}
  @keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}
  #boot p{font-size:14px;opacity:.75;margin:0}
  #err{position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;color:#ffb4b4;
    background:rgba(20,8,8,.92);border:1px solid #5a2a2a;border-radius:8px;padding:8px 10px;font-size:12px;
    display:none;z-index:50;white-space:pre-wrap;font-family:monospace;}
  /* ফোনে পোর্ট্রেটে ল্যান্ডস্কেপ করার অনুরোধ */
  #rotate{position:fixed;inset:0;z-index:40;background:#10172a;color:#f3e7c8;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;}
  #rotate .ph{width:70px;height:112px;border:4px solid #f2c879;border-radius:12px;position:relative;
    animation:tilt 1.6s ease-in-out infinite;}
  #rotate .ph:after{content:'';position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    width:22px;height:3px;background:#f2c879;border-radius:2px;}
  #rotate h2{margin:0;font-size:22px;font-weight:700;}
  #rotate p{margin:0;font-size:15px;opacity:.8;}
  @keyframes tilt{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (max-width:950px){ #rotate{display:flex;} #stage{opacity:0;} }
</style>
</head>
<body>
  <div id="stage"><canvas id="game"></canvas></div>
  <div id="boot">
    <h1>শেষ খেয়ার সংকেত</h1>
    <div class="bar"><i></i></div>
    <p>লোড হচ্ছে…</p>
  </div>
  <pre id="err"></pre>
  <div id="rotate"><div class="ph"></div><h2>ফোনটি পাশাপাশি ধরো</h2><p>খেলাটি ল্যান্ডস্কেপ (আড়াআড়ি) মোডে সবচেয়ে সুন্দর চলে।</p></div>
  <script>
    // Surface runtime errors visibly (helps on mobile where console is hidden).
    window.__errbox = document.getElementById('err');
    function showErr(msg){
      try{ var e=window.__errbox; e.style.display='block'; e.textContent += msg + "\n"; }catch(_){}
    }
    window.addEventListener('error', function(ev){
      showErr('ত্রুটি: ' + (ev.message||ev.error) + (ev.filename?(' @ '+ev.filename+':'+ev.lineno):''));
    });
    window.addEventListener('unhandledrejection', function(ev){
      showErr('Promise ত্রুটি: ' + (ev.reason && ev.reason.stack || ev.reason));
    });
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
